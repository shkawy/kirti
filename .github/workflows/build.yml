name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - run: unzip -o kriti.zip
      - run: sed -i 's/entity\.monster\.Zombie;/entity.monster.zombie.Zombie;/' src/main/java/com/kriti/HerobrineEntity.java
      - run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: kriti-jar
          path: build/libs/*.jar
